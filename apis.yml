name: GroupMe
description: >-
  GroupMe is a group messaging application, owned by Microsoft, that lets people
  chat in named groups and direct conversations across iOS, Android, and the web,
  including over SMS. For developers, GroupMe publishes the GroupMe API v3 — a
  REST + JSON API at https://api.groupme.com/v3 authenticated with a per-user
  access token in the X-Access-Token header. The API covers groups and former
  groups, memberships and nicknames, group and direct messages with attachments,
  likes, blocks, user profiles, and bots. A Bayeux/Faye push service delivers
  realtime message and typing events, and bots receive HTTP webhook callbacks for
  every group message. GroupMe was surfaced as a portfolio company of Thrive
  Capital and enriched here from its public developer documentation.
