      - type: has_many
        target: Bot
        via: group_id
  - name: Membership
    id_field: id
    description: A user's membership in a group; carries the per-group nickname and roles.
    relationships:
      - type: belongs_to
        target: Group
        via: group_id
      - type: belongs_to
        target: User
        via: user_id
  - name: Message
    id_field: id
